<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>벼 탭 디자인 점검 — 디자인 시스템 기준 갭 분석</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: { DEFAULT: '#2563eb', foreground: '#f8fafc' },
        },
      },
    },
  };
</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  html, body { font-family: 'Pretendard Variable', -apple-system, system-ui, sans-serif; }
  .code { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11.5px; line-height: 1.55; }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
</style>
</head>
<body class="bg-slate-50 text-slate-900">
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo } = React;

// ===== severity helpers =====
const SEV = {
  P0: { label: 'P0', tone: 'bg-red-50 text-red-700 border-red-200', desc: '디자인 시스템 위반 — 즉시 교체 필요' },
  P1: { label: 'P1', tone: 'bg-amber-50 text-amber-700 border-amber-200', desc: '패턴 불일치 — 단계적 정렬 필요' },
  P2: { label: 'P2', tone: 'bg-slate-100 text-slate-600 border-slate-200', desc: '폴리시 — 여유 있을 때' },
  FN: { label: 'UX', tone: 'bg-violet-50 text-violet-700 border-violet-200', desc: '기능/사용성 개선 제안' },
};

function SevTag({ k }) {
  const s = SEV[k];
  return (
    <span className={`inline-flex items-center justify-center h-5 px-1.5 rounded text-[10.5px] font-bold border tabular-nums ${s.tone}`}>
      {s.label}
    </span>
  );
}

// ===== layout =====
function Section({ id, eyebrow, title, subtitle, children }) {
  return (
    <section id={id} className="scroll-mt-24 mb-14">
      <div className="mb-5">
        {eyebrow && <div className="text-[10.5px] font-bold tracking-[0.14em] text-slate-400 uppercase mb-1.5">{eyebrow}</div>}
        <h2 className="text-[22px] font-bold tracking-tight text-slate-900">{title}</h2>
        {subtitle && <p className="text-[13px] text-slate-500 mt-1.5 leading-relaxed">{subtitle}</p>}
      </div>
      <div className="space-y-4">{children}</div>
    </section>
  );
}

// ===== finding card =====
function Finding({ sev, title, where, dsRef, issue, fix, code, children }) {
  return (
    <div className="bg-white border border-slate-200 rounded-xl overflow-hidden">
      <div className="px-5 pt-4 pb-3 border-b border-slate-100">
        <div className="flex items-start gap-2.5 mb-1.5">
          <SevTag k={sev} />
          <h3 className="text-[14.5px] font-bold text-slate-900 leading-snug">{title}</h3>
        </div>
        <div className="flex flex-wrap gap-x-3 gap-y-1 text-[11px] text-slate-500 pl-[34px]">
          {where && <span>📂 <span className="mono text-slate-600">{where}</span></span>}
          {dsRef && <span>📘 디자인 시스템 <span className="font-semibold text-slate-700">{dsRef}</span></span>}
        </div>
      </div>
      <div className="px-5 py-4 space-y-3 text-[12.5px] leading-relaxed">
        {issue && (
          <div>
            <div className="text-[10.5px] font-bold tracking-wider text-red-600 uppercase mb-1">현 상태</div>
            <div className="text-slate-700">{issue}</div>
          </div>
        )}
        {fix && (
          <div>
            <div className="text-[10.5px] font-bold tracking-wider text-emerald-700 uppercase mb-1">권장 변경</div>
            <div className="text-slate-700">{fix}</div>
          </div>
        )}
        {code && (
          <pre className="code bg-slate-900 text-slate-100 px-4 py-3 rounded-md overflow-auto whitespace-pre-wrap">{code}</pre>
        )}
        {children}
      </div>
    </div>
  );
}

function Diff({ before, after }) {
  return (
    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mt-2">
      <div className="rounded-md border border-red-200 bg-red-50/40 p-3">
        <div className="text-[10.5px] font-bold tracking-wider text-red-600 uppercase mb-1.5">현재 (벼)</div>
        <pre className="code text-slate-800 whitespace-pre-wrap">{before}</pre>
      </div>
      <div className="rounded-md border border-emerald-200 bg-emerald-50/40 p-3">
        <div className="text-[10.5px] font-bold tracking-wider text-emerald-700 uppercase mb-1.5">권장</div>
        <pre className="code text-slate-800 whitespace-pre-wrap">{after}</pre>
      </div>
    </div>
  );
}

// ===== top summary =====
const COUNTS = { P0: 4, P1: 7, P2: 4, FN: 3 };

function TopBar() {
  return (
    <header className="border-b border-slate-200 bg-white">
      <div className="max-w-[1080px] mx-auto px-6 sm:px-10 py-7">
        <div className="text-[10.5px] font-bold tracking-[0.14em] text-slate-400 uppercase mb-1.5">벼 탭 디자인 점검</div>
        <h1 className="text-[28px] font-bold tracking-tight text-slate-900 leading-tight">
          오래된 벼 페이지를 디자인 시스템에 맞춰 정렬하기
        </h1>
        <p className="text-[13.5px] text-slate-600 mt-2 leading-relaxed max-w-2xl">
          잡곡 탭 페이지들은 최신 핸드오프 기준으로 새로 만들어졌지만 벼 탭 페이지들(원물재고/도정관리/제품재고)은 가장 먼저 구현되어 디자인 토큰·패턴이 시스템과 어긋나 있습니다.
          아래는 페이지·서브 라우트·다이얼로그까지 모두 훑은 점검 결과입니다.
        </p>

        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-6">
          {Object.entries(COUNTS).map(([k, n]) => (
            <div key={k} className={`rounded-lg border px-3 py-2.5 ${SEV[k].tone}`}>
              <div className="flex items-baseline justify-between">
                <span className="text-[10.5px] font-bold tracking-wider uppercase">{SEV[k].label}</span>
                <span className="text-[20px] font-black tabular-nums leading-none">{n}</span>
              </div>
              <div className="text-[10.5px] mt-1 opacity-90 leading-tight">{SEV[k].desc}</div>
            </div>
          ))}
        </div>
      </div>
    </header>
  );
}

// ===== Page-by-page summary card =====
function PageCard({ path, label, status, items }) {
  return (
    <div className="bg-white border border-slate-200 rounded-xl p-5">
      <div className="flex items-center justify-between mb-3">
        <div>
          <div className="text-[10.5px] font-mono text-slate-400 mb-0.5">{path}</div>
          <div className="text-[15px] font-bold text-slate-900">{label}</div>
        </div>
        <span className={`text-[10.5px] font-bold px-2 py-1 rounded border ${status.tone}`}>{status.label}</span>
      </div>
      <ul className="space-y-1.5">
        {items.map((it, i) => (
          <li key={i} className="flex items-start gap-2 text-[12px] text-slate-700">
            <SevTag k={it.sev} />
            <span className="leading-snug">{it.text}</span>
          </li>
        ))}
      </ul>
    </div>
  );
}

// ===== comparison row =====
function CmpRow({ topic, ds, misc, rice }) {
  return (
    <tr className="border-t border-slate-100">
      <td className="py-3 px-3 text-[12px] font-semibold text-slate-800 align-top w-[180px]">{topic}</td>
      <td className="py-3 px-3 text-[11.5px] text-slate-600 align-top">{ds}</td>
      <td className="py-3 px-3 text-[11.5px] text-slate-700 align-top">{misc}</td>
      <td className="py-3 px-3 text-[11.5px] text-slate-700 align-top">{rice}</td>
    </tr>
  );
}

// ====================================================
//   APP
// ====================================================
function App() {
  return (
    <div>
      <TopBar />

      <main className="max-w-[1080px] mx-auto px-6 sm:px-10 py-10">

        {/* ========================================== */}
        <Section
          id="overview"
          eyebrow="요약"
          title="가장 큰 갭 한 줄로"
          subtitle="벼 탭의 모든 시각 토큰이 레거시 하늘색(#00a2e8) 기반이고, 그룹 펼침·모바일 그룹·헤더 액션·상태 뱃지 패턴이 핸드오프 §1·§3·§4와 모두 다릅니다."
        >
          <div className="bg-white border border-slate-200 rounded-xl p-5">
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div className="space-y-2.5">
                <div className="text-[12.5px] font-bold text-slate-800">📌 잡곡 탭이 이미 따르는 패턴 (정답지)</div>
                <ul className="text-[12px] text-slate-600 space-y-1 pl-4 list-disc marker:text-emerald-500">
                  <li>색은 모두 <code className="mono text-[11px] bg-slate-100 px-1 rounded">primary</code>·slate 토큰</li>
                  <li>펼친 그룹 = <code className="mono text-[11px] bg-slate-100 px-1 rounded">bg-slate-50/60 + ring-1 ring-inset</code></li>
                  <li>모바일 펼친 그룹 = <code className="mono text-[11px] bg-slate-100 px-1 rounded">bg-slate-50/70</code> 묶음 컨테이너 + 카드는 흰 배경</li>
                  <li>인증 뱃지 = <code className="mono text-[11px] bg-slate-100 px-1 rounded">CERT_BADGE_CLASS</code> 상수 재사용</li>
                  <li>행 액션 = <code className="mono text-[11px] bg-slate-100 px-1 rounded">DropdownMenu</code> (수정/삭제/도정)</li>
                  <li>빈 상태 = 아이콘 + 친근 카피 (<code className="mono text-[11px] bg-slate-100 px-1 rounded">EmptyState</code> 패턴)</li>
                </ul>
              </div>
              <div className="space-y-2.5">
                <div className="text-[12.5px] font-bold text-slate-800">🚧 벼 탭이 아직 들고 있는 흔적</div>
                <ul className="text-[12px] text-slate-600 space-y-1 pl-4 list-disc marker:text-red-500">
                  <li><code className="mono text-[11px] bg-red-50 text-red-700 px-1 rounded">#00a2e8</code>·<code className="mono text-[11px] bg-red-50 text-red-700 px-1 rounded">#008cc9</code> 하드코딩 (raw-stocks·milling·sales/release에 70+곳)</li>
                  <li>펼친 그룹 = <code className="mono text-[11px] bg-red-50 text-red-700 px-1 rounded">bg-[#00a2e8]/[0.04]</code> (NOTE 위반)</li>
                  <li>모바일 펼친 그룹 = <code className="mono text-[11px] bg-red-50 text-red-700 px-1 rounded">border-l-4 border-blue-200</code> 좌측 라인 패턴</li>
                  <li>인증 뱃지 = 셀 안에 인라인 hex 분기</li>
                  <li>행 액션 = 셀에 Edit·Trash 아이콘 2개 노출 (모바일만 Dropdown)</li>
                  <li>빈 상태 = "검색 결과가 없습니다." (반말체 + 아이콘 없음)</li>
                </ul>
              </div>
            </div>
          </div>
        </Section>

        {/* ========================================== */}
        {/*  P0 — 디자인 시스템 위반                  */}
        {/* ========================================== */}
        <Section
          id="p0"
          eyebrow="P0 · 디자인 시스템 위반"
          title="레거시 토큰 · 위반 패턴 — 즉시 교체"
          subtitle="핸드오프 §1.1에 '#00a2e8은 사용 금지'로 못박혀 있고, §4.2.6 NOTE는 펼침 그룹의 primary 액센트를 명시적으로 금지합니다."
        >
          <Finding
            sev="P0"
            title="레거시 #00a2e8 / #008cc9 하드코딩이 벼 탭 거의 모든 컴포넌트에 박혀 있음"
            where="raw-stocks/* (10+ 파일) · milling/* (8+ 파일) · sales/release/* (4 파일)"
            dsRef="§1.1 Color"
            issue={
              <span>
                <code className="mono bg-red-50 text-red-700 px-1 rounded">#00a2e8</code>은 핸드오프에서 <strong>사용 금지</strong>로 지정된 레거시 시안톤입니다.
                현재 페이지 헤더, 체크박스 체크 상태, 그룹 행 배경, 보유 뱃지, 합계 숫자, primary 버튼, 호버 톤, floating cart, 통계 차트까지
                약 <strong>70여 곳</strong>에 그대로 박혀 있습니다.
              </span>
            }
            fix={
              <span>
                전수 치환. <code className="mono bg-slate-100 px-1 rounded">bg-[#00a2e8]</code> → <code className="mono bg-slate-100 px-1 rounded">bg-primary</code>,
                <code className="mono bg-slate-100 px-1 rounded">text-[#00a2e8]</code> → <code className="mono bg-slate-100 px-1 rounded">text-primary</code>,
                <code className="mono bg-slate-100 px-1 rounded">text-[#008cc9]</code> → <code className="mono bg-slate-100 px-1 rounded">text-primary</code> (또는 합계 강조는 slate-900 굵게).
                루트의 <code className="mono">replace-colors.js</code>가 이미 있는데 적용 범위가 누락된 듯합니다. 단일 PR로 일괄 치환 + 시각 회귀 테스트 권장.
              </span>
            }
            code={`# 영향 받는 위치 (대표 사례)
raw-stocks/stock-list-client.tsx:213    bg-[#00a2e8]/[0.04] hover:bg-[#00a2e8]/[0.08]
raw-stocks/stock-list-client.tsx:227    data-[state=checked]:bg-[#00a2e8]
raw-stocks/stock-list-client.tsx:263    text-[#008cc9]
raw-stocks/stock-list-client.tsx:364    bg-[#00a2e8]/[0.08]
raw-stocks/stock-list-client.tsx:408    text-[#008cc9]
raw-stocks/stock-list-client.tsx:475    border-[#00a2e8] bg-[#f0f9ff] ring-1 ring-[#00a2e8]/20
raw-stocks/stock-table-row.tsx:62       hover:bg-[#00a2e8]/10
raw-stocks/stock-table-row.tsx:133      bg-[#00a2e8]/10 text-[#008cc9]
raw-stocks/stock-page-wrapper.tsx:207   rounded-full bg-[#00a2e8] hover:bg-[#008cc9]  ← floating cart
milling/milling-table-row.tsx:166       text-[#00a2e8]
milling/mobile-milling-card.tsx:120     border-[#00a2e8] bg-[#f0f9ff]
milling/add-form.tsx:119                bg-[#00a2e8] shadow-[#00a2e8]/30
milling/stock-list-dialog.tsx:206       bg-[#00a2e8]                   ← 다이얼로그 내부
sales/release/release-history-list.tsx:180   text-[#00a2e8]            ← '/sales > 출고' 탭`}
          />

          <Finding
            sev="P0"
            title="펼친 그룹 행에 primary 액센트 사용 — §4.2.6 NOTE 명시적 위반"
            where="raw-stocks/stock-list-client.tsx · 데스크탑/모바일 둘 다"
            dsRef="§4.2.6"
            issue={
              <span>
                핸드오프 §4.2.6 NOTE에 <em>"초기 시안에서는 시안톤으로 강조했으나, 같은 테이블 안에 낱개 행이 섞이면 톤이 어긋나 보여 slate-50 + ring으로 톤다운. primary 액센트는 사용하지 않음"</em>이라고 명시되어 있습니다.
                벼 탭은 아직 시안톤 강조 시점의 코드입니다.
              </span>
            }
            fix={
              <span>
                잡곡(<code className="mono">misc-stock-list-client.tsx</code>)의 그룹 행 톤을 그대로 이식.
                <strong>펼친 그룹</strong>: <code className="mono">bg-slate-50/60 hover:bg-slate-100/60</code>,
                테두리는 <code className="mono">border-y border-slate-200/70</code>.
              </span>
            }
          />
          <Diff
            before={`// stock-list-client.tsx:213 (데스크탑)
<TableRow className="bg-[#00a2e8]/[0.04]
  hover:bg-[#00a2e8]/[0.08]
  border-y border-[#00a2e8]/20 ...">

// stock-list-client.tsx:364 (모바일)
<div className={\`... \${isExpanded
  ? 'border-blue-300 bg-[#00a2e8]/[0.08]'
  : 'border-slate-200 bg-[#00a2e8]/[0.04]'}\`}>`}
            after={`// misc-stock-list-client.tsx:206 (참조 — 잡곡)
<TableRow className={\`... \${isExpanded
  ? 'bg-slate-50/60 hover:bg-slate-100/60'
  : 'bg-slate-50 hover:bg-slate-100'}
  border-y border-slate-200/70\`}>

// 모바일도 슬레이트 톤만 사용 — bg-white + shadow로
// 깊이감만 변화 (시안톤 ❌)`}
          />

          <Finding
            sev="P0"
            title="모바일 펼친 그룹 — '좌측 굵은 청색 보더' 패턴이 §4.2.7과 다름"
            where="raw-stocks/stock-list-client.tsx:366"
            dsRef="§4.2.7"
            issue={
              <span>
                벼 모바일은 펼친 후 하위 카드를 <code className="mono bg-red-50 text-red-700 px-1 rounded">border-l-4 border-blue-200 ml-4 pl-3</code>로 들여쓰고 청색 라인을 답니다.
                §4.2.7은 <em>"펼친 그룹은 bg-slate-50/70 묶음 컨테이너, 내부 카드는 흰색 + border-slate-200/80"</em>로 표현하라고 합니다.
              </span>
            }
            fix={<span>좌측 라인 제거 → 잡곡과 동일한 회색 묶음 컨테이너로 교체. 깊이감은 컨테이너 배경 하나로 처리.</span>}
          />

          <Finding
            sev="P0"
            title="인증 뱃지(유기·무농·일반) — 셀 안에 hex 인라인 분기, 잡곡은 상수화"
            where="raw-stocks/stock-table-row.tsx:100 · 모바일도 동일"
            dsRef="§4.5 뱃지"
            issue={
              <span>
                벼 데스크탑 행은 <code className="mono">유기농 → #8dc540</code>, <code className="mono">무농약 → #00a2e8</code>으로 셀 안에서 직접 hex를 분기합니다.
                잡곡 탭은 <code className="mono">CERT_BADGE_CLASS</code> 상수를 <code className="mono">misc-stock-table-row.tsx</code>에서 export해 공용으로 씁니다.
              </span>
            }
            fix={
              <span>
                <code className="mono">CERT_BADGE_CLASS</code>를 <code className="mono">components/badges/cert-badge.tsx</code> 같은 공용 위치로 끌어올리고
                벼·잡곡 모두에서 import. 색상은 <code className="mono">유기농 = emerald-600</code>, <code className="mono">무농약 = primary</code>, <code className="mono">일반 = slate</code> 정도로 토큰화.
              </span>

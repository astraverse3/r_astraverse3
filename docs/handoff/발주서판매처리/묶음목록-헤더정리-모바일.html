<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="design_doc_mode" content="canvas">
<title>묶음 목록 헤더 정리 — 모바일</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:{DEFAULT:'#2563eb'}}}}};</script>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin="" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
html,body{font-family:'Pretendard Variable',-apple-system,system-ui,sans-serif}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}
.screen{width:390px;height:800px;background:#f1f5f9;border-radius:30px;box-shadow:0 24px 60px rgba(15,23,42,.22);overflow:hidden;display:flex;flex-direction:column;border:1px solid #e2e8f0;position:relative}
.frame-label{font-size:13px;font-weight:700;color:#0f172a;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.frame-label .pill{font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;background:#fff;border:1px solid #cbd5e1;color:#475569}
.frame-note{font-size:11.5px;color:#475569;line-height:1.5;margin-bottom:12px;height:46px}
.nos{scrollbar-width:none}.nos::-webkit-scrollbar{display:none}
a{color:#2563eb}a:hover{color:#1d4ed8}
.hdr-hi{position:relative}
.hdr-hi::after{content:attr(data-rows);position:absolute;right:-1px;top:-1px;background:#0f172a;color:#fff;font-size:9.5px;font-weight:700;padding:1px 6px;border-bottom-left-radius:6px;letter-spacing:.02em}
</style>
</head>
<body class="bg-slate-200">
<div style="position:absolute;left:40px;top:36px;width:2150px">
  <h1 style="font-size:20px;font-weight:800;color:#0f172a;letter-spacing:-.02em">묶음 목록 — 모바일 헤더 정리</h1>
  <p style="font-size:13px;color:#475569;margin-top:6px;line-height:1.6;max-width:1200px">
    현재 모바일에서 목록 위가 <b>세 줄</b>(탭 · 업로드 버튼 단독 행 · 칩 2줄)이라 첫 화면에 카드가 2.5장밖에 안 들어온다.
    <b>업로드 버튼을 어디로 보내느냐</b>와 <b>칩을 한 줄에 가두느냐</b>가 유일한 변수다. 목록 본문은 세 안 모두 동일.
  </p>
</div>
<div id="stage"></div>
<script>
const CH={택배:'bg-blue-50 text-blue-700',이마트:'bg-violet-50 text-violet-700',서울급식:'bg-teal-50 text-teal-700',해남급식:'bg-cyan-50 text-cyan-700',기업별:'bg-slate-100 text-slate-600'};
const icoUp='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>';
const icoPkg='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 9.4 7.5 4.2M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></svg>';
const icoTruck='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 17h4V5H2v12h3M20 17h2v-3.34a4 4 0 0 0-1.17-2.83L19 9h-5v8h1"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>';
const icoChev='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
const icoDots='<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>';
const icoCheck='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const icoPen='<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
const icoMemo='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';

const topbar=`<div class="bg-white px-4 h-[52px] shrink-0 flex items-center justify-between border-b border-slate-100">
<div class="flex items-center gap-2"><div class="w-7 h-7 rounded-full bg-gradient-to-br from-lime-400 to-emerald-500"></div><span class="text-[13px] font-extrabold text-slate-800 tracking-tight">땅끝황토친환경</span></div>
<div class="flex items-center gap-2.5"><div class="w-7 h-7 rounded-full bg-slate-300"></div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.9"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.63.67 1.09 1.31 1.1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1"/></svg></div></div>`;

const tabs=(extra='')=>`<div class="grid ${extra?'grid-cols-[1fr_1fr_44px]':'grid-cols-2'} gap-1 p-0.5 bg-slate-100 rounded-lg">
<button class="h-11 rounded-md flex items-center justify-center gap-1.5 bg-white shadow-sm text-slate-900">${icoPkg}<span class="text-[13px] font-bold">제품판매</span></button>
<button class="h-11 rounded-md flex items-center justify-center gap-1.5 text-slate-500">${icoTruck}<span class="text-[13px] font-semibold">원물출고</span></button>${extra}</div>`;

const chip=(l,on)=>`<button class="shrink-0 h-7 px-2.5 rounded-full text-[12px] ${on?'font-bold bg-slate-900 text-white':'font-medium bg-white text-slate-600 border border-slate-200'}">${l}</button>`;
const CHIPS=['전체 5','택배 1','이마트 1','서울급식 1','해남급식 1','기업별 1'];
const chipsWrap=`<div class="flex items-center gap-1.5 flex-wrap">${CHIPS.map((c,i)=>chip(c,i===0)).join('')}</div>`;
const chipsScroll=`<div class="nos flex items-center gap-1.5 overflow-x-auto">${CHIPS.map((c,i)=>chip(c,i===0)).join('')}</div>`;

const th=`<div class="grid grid-cols-[84px_minmax(0,1fr)_52px_36px] items-center gap-2 px-3 py-2 bg-slate-50 border-b border-slate-200 text-[11px] font-bold text-slate-400"><div>채널</div><div>시트명</div><div class="text-right">수령인</div><div></div></div>`;
function row(o){return `<div class="border-b border-slate-100 last:border-b-0 ${o.tone==='today'?'bg-red-50/50':o.tone==='done'?'opacity-60':''}">
<div class="grid grid-cols-[84px_minmax(0,1fr)_52px_36px] items-center gap-2 px-3 py-2.5">
<div><span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-bold ${CH[o.ch]}">${o.ch}</span></div>
<div class="min-w-0"><p class="text-[13.5px] font-bold text-slate-900 truncate">${o.sheet}</p><p class="text-[10.5px] text-slate-400 truncate">발주서-통일양식-템플릿.xlsx</p></div>
<div class="text-right text-[13px] text-slate-700 mono">${o.cnt}</div>
<div class="flex justify-center text-slate-400">${icoDots}</div></div>
<div class="px-3 pb-2.5 flex items-center gap-1.5 flex-wrap">${o.load}<span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded bg-slate-100 text-slate-500 text-[10.5px] font-bold"><span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>대기 ${o.cnt}</span><span class="text-[10.5px] text-slate-400 ml-auto mono">${o.at}</span></div>
${o.memo?`<div class="px-3 pb-2.5 -mt-0.5 flex items-center gap-1 text-[11px] text-slate-400">${icoMemo}${o.memo}</div>`:''}</div>`}
const loadToday='<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-red-600 text-white text-[11px] font-bold">오늘 오후 · 직접배송'+icoPen+'</span>';
const loadDone=d=>`<span class="inline-flex items-center gap-1 text-[11.5px] text-slate-500 font-medium">${icoCheck}${d} 상차 완료${icoPen}</span>`;
const list=[
 row({ch:'해남급식',sheet:'해남급식_260821',cnt:2,load:loadToday,at:'08.26 13:53',tone:'today'}),
 row({ch:'이마트',sheet:'이마트_260819',cnt:3,load:loadDone('9/18'),at:'09.10 14:21',memo:'test'}),
 row({ch:'서울급식',sheet:'서울급식_260818',cnt:3,load:loadDone('9/17'),at:'09.10 14:21',memo:'test'}),
 row({ch:'기업별',sheet:'시아스_260811',cnt:1,load:loadDone('9/16'),at:'09.10 14:21'}),
 row({ch:'택배',sheet:'택배_260818',cnt:67,load:loadDone('9/15'),at:'09.08 11:02'}),
].join('');
const body=`<div class="nos flex-1 overflow-y-auto px-3 pt-3 pb-24"><div class="bg-white rounded-xl border border-slate-200 overflow-hidden">${th}${list}</div>
<p class="text-[10.5px] text-slate-400 mt-3 px-1 leading-relaxed">묶음 1건 = 시트 1장 · 상차 임박순으로 정렬돼요 — 먼저 나갈 것이 먼저 포장되도록</p></div>`;
const navItem=(l,d)=>`<button class="flex flex-col items-center gap-0.5 text-slate-400"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg><span class="text-[10px] font-semibold">${l}</span></button>`;
const nav=`<div class="absolute left-3 right-3 bottom-3 h-[58px] bg-white rounded-full shadow-[0_8px_24px_rgba(15,23,42,.14)] border border-slate-100 flex items-center justify-around px-5">
<div class="w-9 h-9 rounded-full bg-slate-800 text-white text-[12px] font-bold flex items-center justify-center">N</div>
${navItem('도정','<circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>')}
${navItem('제품','<path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/>')}
<div class="w-12 h-12 rounded-full bg-primary text-white flex items-center justify-center shadow-lg -mt-1"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg></div>
${navItem('통계','<path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/>')}</div>`;

const HEADERS={
 now:`<div class="bg-white px-3 pt-3 pb-2.5 border-b border-slate-100 shrink-0 hdr-hi" data-rows="3줄">${tabs()}
 <div class="flex justify-end mt-2.5"><button class="inline-flex items-center gap-1.5 h-9 px-3 rounded-lg bg-primary text-white text-[12.5px] font-semibold">${icoUp}</button></div>
 <div class="mt-2.5">${chipsWrap}</div></div>`,
 a:`<div class="bg-white px-3 pt-3 pb-2.5 border-b border-slate-100 shrink-0 hdr-hi" data-rows="2줄">
 ${tabs('<button class="h-11 w-11 rounded-md bg-primary text-white flex items-center justify-center shadow-sm">'+icoUp+'</button>')}
 <div class="mt-2.5">${chipsScroll}</div></div>`,
 b:`<div class="bg-white px-3 pt-3 pb-2.5 border-b border-slate-100 shrink-0 hdr-hi" data-rows="2줄">${tabs()}
 <div class="flex items-center gap-2 mt-2.5"><div class="min-w-0 flex-1">${chipsScroll}</div>
 <div class="shrink-0 pl-2 -ml-2 bg-gradient-to-l from-white via-white to-transparent"><button class="inline-flex items-center justify-center h-8 w-9 rounded-lg bg-primary text-white shadow-sm">${icoUp}</button></div></div></div>`,
 c:`<div class="bg-white px-3 pt-3 pb-3 border-b border-slate-100 shrink-0 hdr-hi" data-rows="1줄">
 ${tabs('<button class="h-11 w-11 rounded-md bg-primary text-white flex items-center justify-center shadow-sm">'+icoUp+'</button>')}</div>
 <div class="px-3 pt-2.5 shrink-0 flex items-center justify-between">
 <button class="inline-flex items-center gap-1 h-8 pl-3 pr-2.5 rounded-full bg-white border border-slate-200 text-[12.5px] font-bold text-slate-700 shadow-sm">전체 <span class="mono">5</span>${icoChev}</button>
 <button class="inline-flex items-center gap-1 h-8 pl-2.5 pr-2 rounded-full text-[12px] font-semibold text-slate-500"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5h10M11 12h7M11 19h4M3 8l3-3 3 3M6 5v14"/></svg>상차 임박순${icoChev}</button></div>`,
 c2:`<div class="bg-white px-3 pt-3 pb-3 border-b border-slate-100 shrink-0 hdr-hi" data-rows="1줄">
 ${tabs('<button class="h-11 w-11 rounded-md bg-primary text-white flex items-center justify-center shadow-sm">'+icoUp+'</button>')}</div>
 <div class="px-3 pt-2.5 shrink-0 flex items-center justify-between relative z-20">
 <button class="inline-flex items-center gap-1 h-8 pl-3 pr-2.5 rounded-full bg-white border border-slate-200 text-[12.5px] font-bold text-slate-700 shadow-sm">전체 <span class="mono">5</span>${icoChev}</button>
 <button class="inline-flex items-center gap-1 h-8 pl-2.5 pr-2 rounded-full bg-slate-900 text-white text-[12px] font-bold"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5h10M11 12h7M11 19h4M3 8l3-3 3 3M6 5v14"/></svg>상차 임박순${icoChev}</button>
 <div class="absolute right-3 top-[38px] w-[196px] bg-white rounded-xl border border-slate-200 shadow-xl overflow-hidden">
 ${[['상차 임박순','먼저 나갈 것 먼저',1],['업로드 최신순','방금 올린 것 확인',0],['미처리 많은 순','손 많이 갈 것 먼저',0]].map(([t,d,on])=>`<button class="w-full text-left px-3 py-2.5 border-b border-slate-100 last:border-b-0 ${on?'bg-blue-50/60':''} flex items-start gap-2"><span class="w-3.5 shrink-0 pt-0.5 text-primary">${on?icoCheck:''}</span><span><span class="block text-[12.5px] font-bold ${on?'text-primary':'text-slate-700'}">${t}</span><span class="block text-[10.5px] text-slate-400 mt-0.5">${d}</span></span></button>`).join('')}
 </div></div>`,
};
const FRAMES=[
 ['현재','탭 · 업로드 단독 행 · 칩 2줄. 업로드 버튼 하나가 한 줄을 통째로 쓰고, 칩은 6개라 390px에서 반드시 2줄이 된다.','now','#fff'],
 ['A안 — 탭 행 흡수','업로드를 탭 오른쪽 아이콘 버튼으로 붙이고 칩은 가로 스크롤 1줄. 코드 변경이 가장 작다(단독 행 삭제 + flex-wrap→overflow-x).','a','#fff'],
 ['B안 — 칩 행 흡수','탭은 2칸 그대로 두고, 업로드를 칩 줄 오른쪽 끝에 고정. 탭 폭이 안 줄어 라벨이 온전하다.','b','#fff'],
 ['C안 — 칩을 드롭다운으로','채널이 5개까지 늘어나면 칩 줄 자체가 부담. 「전체 5 ▾」 한 개로 접고 오른쪽에 정렬 기준을 노출한다. 목록 위 = 사실상 1줄.','c','#f1f5f9'],
 ['C안 + 정렬 전환','정렬을 바꿀 수 있게 한다면 이 자리다. 기본은 지금과 같은 <b>상차 임박순</b>(서버 정렬), 나머지 둘은 이미 내려온 데이터로 클라이언트에서 다시 세운다.','c2','#f1f5f9'],
];
document.getElementById('stage').innerHTML=FRAMES.map(([t,note,k,bg],i)=>
`<div style="position:absolute;left:${40+i*430}px;top:150px;width:390px">
<div class="frame-label"><span class="pill">${i===0?'AS-IS':'제안'}</span>${t}</div>
<div class="frame-note">${note}</div>
<div class="screen">${topbar}${HEADERS[k]}${body}${nav}</div></div>`).join('');
</script>
</body></html>

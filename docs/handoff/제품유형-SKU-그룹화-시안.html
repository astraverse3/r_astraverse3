<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>제품유형 SKU 목록 — 그룹화 시안</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: { primary: { DEFAULT: '#2563eb', foreground: '#f8fafc' } } } },
  };
</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  html, body { font-family: 'Pretendard Variable', -apple-system, system-ui, sans-serif; margin: 0; }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
</style>
</head>
<body class="bg-slate-100">
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#2563eb"/>
    <rect x="20" y="24" width="60" height="12" rx="3" fill="#fff"/>
    <rect x="28" y="42" width="52" height="9" rx="2" fill="#bfdbfe"/>
    <rect x="28" y="55" width="52" height="9" rx="2" fill="#bfdbfe"/>
    <rect x="20" y="72" width="60" height="9" rx="2" fill="#fff"/>
  </svg>
</template>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">
const { useState } = React;

/* ──────────────────────────────────────────────
   데이터 — 품종별로 여러 SKU
   ────────────────────────────────────────────── */
const DATA = [
  { variety: '신동진', grain: '메벼', milling: '백미', spec: '10kg', pkg: '자연주의',   isDefault: true,  active: true },
  { variety: '신동진', grain: '메벼', milling: '백미', spec: '20kg', pkg: '친환경실속', isDefault: false, active: true },
  { variety: '신동진', grain: '메벼', milling: '현미', spec: '10kg', pkg: '자연주의',   isDefault: true,  active: true },
  { variety: '추청',   grain: '메벼', milling: '백미', spec: '10kg', pkg: '명품한정',   isDefault: true,  active: true },
  { variety: '추청',   grain: '메벼', milling: '현미', spec: '10kg', pkg: '명품한정',   isDefault: true,  active: true },
  { variety: '삼광',   grain: '메벼', milling: '백미', spec: '4kg',  pkg: '선물세트',   isDefault: false, active: true },
  { variety: '삼광',   grain: '메벼', milling: '백미', spec: '10kg', pkg: '자연주의',   isDefault: true,  active: true },
  { variety: '골든퀸', grain: '메벼', milling: '오분도미', spec: '10kg', pkg: '구포장(2024)', isDefault: false, active: false },
];

const groupByVariety = () => {
  const m = new Map();
  DATA.forEach((r) => {
    if (!m.has(r.variety)) m.set(r.variety, []);
    m.get(r.variety).push(r);
  });
  return [...m.entries()].map(([variety, rows]) => ({ variety, grain: rows[0].grain, rows }));
};
const GROUPS = groupByVariety();

/* ── 아이콘 ── */
const Plus  = (p) => <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" {...p}><path d="M12 5v14M5 12h14"/></svg>;
const Pencil= (p) => <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>;
const Trash = (p) => <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
const Star  = (p) => <svg viewBox="0 0 24 24" width="13" height="13" {...p}><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>;
const Chev  = ({ open }) => <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" style={{ transform: open ? 'rotate(0deg)' : 'rotate(-90deg)', transition: 'transform .15s' }}><path d="m6 9 6 6 6-6"/></svg>;

const StatusPill = ({ active }) => (
  <span className={`text-[11px] px-2 py-0.5 rounded-full ${active ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-100 text-slate-400'}`}>{active ? '활성' : '비활성'}</span>
);
const RowActions = () => (
  <div className="inline-flex items-center gap-0.5">
    <button className="p-1.5 text-slate-400 hover:text-primary rounded-full hover:bg-primary/10 transition-colors"><Pencil /></button>
    <button className="p-1.5 text-slate-400 hover:text-red-600 rounded-full hover:bg-red-50 transition-colors"><Trash /></button>
  </div>
);

/* 카드 셸 — 포장지 마스터 생략, 카탈로그만 */
function CatalogShell({ children, count }) {
  return (
    <div className="p-4 bg-slate-100 min-h-full">
      <section className="rounded-xl border border-slate-200 bg-white p-4">
        <div className="flex items-center justify-between mb-3">
          <div className="flex items-baseline gap-2">
            <h2 className="text-sm font-bold text-slate-800">제품유형(SKU) 카탈로그</h2>
            <span className="text-[11px] text-slate-400">품종 {GROUPS.length} · SKU {count}</span>
          </div>
          <button className="inline-flex items-center gap-1.5 h-8 px-4 rounded-md text-sm font-medium bg-primary hover:bg-primary/90 text-white">
            <Plus /><span>제품유형 등록</span>
          </button>
        </div>
        {children}
      </section>
    </div>
  );
}

/* ════════════════════════════════════════════════
   A · 품종별 아코디언 (헤더 + 하위 행)
   ════════════════════════════════════════════════ */
function VarietyAccordion() {
  const [open, setOpen] = useState(() => Object.fromEntries(GROUPS.map((g) => [g.variety, true])));
  const total = DATA.length;
  return (
    <CatalogShell count={total}>
      <div className="flex flex-col gap-2">
        {GROUPS.map((g) => {
          const isOpen = open[g.variety];
          const activeN = g.rows.filter((r) => r.active).length;
          return (
            <div key={g.variety} className="rounded-lg border border-slate-200 overflow-hidden">
              {/* 그룹 헤더 */}
              <button
                onClick={() => setOpen((s) => ({ ...s, [g.variety]: !s[g.variety] }))}
                className="w-full flex items-center justify-between px-3 py-2.5 bg-slate-50 hover:bg-primary/5 transition-colors">
                <div className="flex items-center gap-2">
                  <span className="text-slate-400"><Chev open={isOpen} /></span>
                  <span className="font-bold text-[14px] text-slate-900">{g.variety}</span>
                  <span className="text-[10px] px-1.5 h-4 inline-flex items-center border border-slate-200 text-slate-500 bg-white rounded">{g.grain}</span>
                </div>
                <div className="flex items-center gap-2 text-[11px] text-slate-400">
                  <span>SKU <b className="text-slate-600">{g.rows.length}</b></span>
                  <span className="text-slate-300">·</span>
                  <span>활성 <b className="text-emerald-600">{activeN}</b></span>
                </div>
              </button>
              {/* 하위 행 */}
              {isOpen && (
                <table className="w-full text-sm border-collapse">
                  <thead>
                    <tr className="text-left text-[10px] text-slate-400 border-b border-slate-100 bg-white">
                      <th className="py-1.5 px-3 font-medium">도정</th>
                      <th className="py-1.5 px-2 font-medium">규격</th>
                      <th className="py-1.5 px-2 font-medium">포장지</th>
                      <th className="py-1.5 px-2 font-medium text-center">기본</th>
                      <th className="py-1.5 px-2 font-medium text-center">상태</th>
                      <th className="py-1.5 px-3 font-medium text-right">관리</th>
                    </tr>
                  </thead>
                  <tbody>
                    {g.rows.map((r, i) => (
                      <tr key={i} className={`border-b border-slate-50 last:border-0 hover:bg-primary/5 transition-colors ${r.active ? '' : 'opacity-50'}`}>
                        <td className="py-2 px-3 text-slate-700 font-medium whitespace-nowrap">{r.milling}</td>
                        <td className="py-2 px-2 text-slate-600 mono whitespace-nowrap">{r.spec}</td>
                        <td className="py-2 px-2 text-slate-600 whitespace-nowrap">{r.pkg}</td>
                        <td className="py-2 px-2 text-center">{r.isDefault && <Star className="inline text-amber-400 fill-amber-400" />}</td>
                        <td className="py-2 px-2 text-center"><StatusPill active={r.active} /></td>
                        <td className="py-2 px-3 text-right"><RowActions /></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          );
        })}
      </div>
    </CatalogShell>
  );
}

/* ════════════════════════════════════════════════
   B · 평면 테이블 + 품종 구분행 (sticky-ish 헤더 한 번)
   ════════════════════════════════════════════════ */
function GroupedTable() {
  return (
    <CatalogShell count={DATA.length}>
      <table className="w-full text-sm border-collapse">
        <thead>
          <tr className="text-left text-[11px] text-slate-400 border-b border-slate-200">
            <th className="py-2 px-2 font-medium">도정</th>
            <th className="py-2 px-2 font-medium">규격</th>
            <th className="py-2 px-2 font-medium">포장지</th>
            <th className="py-2 px-2 font-medium text-center">기본</th>
            <th className="py-2 px-2 font-medium text-center">상태</th>
            <th className="py-2 px-2 font-medium text-right">관리</th>
          </tr>
        </thead>
        <tbody>
          {GROUPS.map((g) => (
            <React.Fragment key={g.variety}>
              {/* 구분행 */}
              <tr className="bg-primary/[0.04]">
                <td colSpan={6} className="py-1.5 px-2">
                  <div className="flex items-center gap-2">
                    <span className="font-bold text-[12.5px] text-primary">{g.variety}</span>
                    <span className="text-[10px] px-1.5 h-4 inline-flex items-center border border-slate-200 text-slate-500 bg-white rounded">{g.grain}</span>
                    <span className="text-[10px] text-slate-400">SKU {g.rows.length}</span>
                  </div>
                </td>
              </tr>
              {g.rows.map((r, i) => (
                <tr key={i} className={`border-b border-slate-50 hover:bg-primary/5 transition-colors ${r.active ? '' : 'opacity-50'}`}>
                  <td className="py-2 px-2 text-slate-700 font-medium whitespace-nowrap pl-4">{r.milling}</td>
                  <td className="py-2 px-2 text-slate-600 mono whitespace-nowrap">{r.spec}</td>
                  <td className="py-2 px-2 text-slate-600 whitespace-nowrap">{r.pkg}</td>
                  <td className="py-2 px-2 text-center">{r.isDefault && <Star className="inline text-amber-400 fill-amber-400" />}</td>
                  <td className="py-2 px-2 text-center"><StatusPill active={r.active} /></td>
                  <td className="py-2 px-2 text-right"><RowActions /></td>
                </tr>
              ))}
            </React.Fragment>
          ))}
        </tbody>
      </table>
    </CatalogShell>
  );
}

/* ════════════════════════════════════════════════
   C · 품종 카드 + 도정별 소그룹
   ════════════════════════════════════════════════ */
function VarietyCards() {
  return (
    <CatalogShell count={DATA.length}>
      <div className="grid grid-cols-2 gap-3">
        {GROUPS.map((g) => {
          // 도정별 소그룹
          const byMilling = new Map();
          g.rows.forEach((r) => { if (!byMilling.has(r.milling)) byMilling.set(r.milling, []); byMilling.get(r.milling).push(r); });
          return (
            <div key={g.variety} className="rounded-lg border border-slate-200 bg-white overflow-hidden">
              <div className="flex items-center justify-between px-3 py-2 border-b border-slate-100 bg-slate-50">
                <div className="flex items-center gap-1.5">
                  <span className="font-bold text-[13.5px] text-slate-900">{g.variety}</span>
                  <span className="text-[10px] px-1.5 h-4 inline-flex items-center border border-slate-200 text-slate-500 bg-white rounded">{g.grain}</span>
                </div>
                <span className="text-[10px] text-slate-400">SKU {g.rows.length}</span>
              </div>
              <div className="p-2.5 flex flex-col gap-2">
                {[...byMilling.entries()].map(([milling, rows]) => (
                  <div key={milling}>
                    <div className="text-[10px] font-bold text-slate-400 mb-1 px-0.5">{milling}</div>
                    <div className="flex flex-col gap-1">
                      {rows.map((r, i) => (
                        <div key={i} className={`flex items-center justify-between px-2 py-1.5 rounded-md border border-slate-100 hover:border-primary/30 hover:bg-primary/5 transition-colors ${r.active ? '' : 'opacity-50'}`}>
                          <div className="flex items-center gap-1.5 min-w-0">
                            <span className="mono text-[11px] font-bold text-slate-700">{r.spec}</span>
                            <span className="text-[11px] text-slate-500 truncate">{r.pkg}</span>
                            {r.isDefault && <Star className="shrink-0 text-amber-400 fill-amber-400" />}
                          </div>
                          <div className="flex items-center gap-1 shrink-0">
                            {!r.active && <StatusPill active={false} />}
                            <RowActions />
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          );
        })}
      </div>
    </CatalogShell>
  );
}

/* ── 주석 ── */
function Note({ children, tone }) {
  const c = tone === 'good' ? 'text-emerald-700' : 'text-slate-500';
  return <div className={`text-[12px] leading-relaxed mb-2 px-1 ${c}`}>{children}</div>;
}

function App() {
  return (
    <DesignCanvas>
      <DCSection
        id="grp"
        title="SKU 목록 그룹화 — 품종 기준"
        subtitle="품종이 SKU의 자연스러운 상위 축(품종 → 도정 → 규격 → 포장지). 색상은 정렬안(블루) 기준. 데이터: 신동진·추청·삼광·골든퀸 8 SKU.">
        <DCArtboard id="a" label="A · 품종 아코디언 (접기/펼치기)" width={580} height={620}>
          <Note tone="good">품종별 카드로 접고 펼침. 헤더에 SKU 수·활성 수 집계. raw-stocks 생산자 그룹과 같은 패턴 → 사이트 일관성 ↑. 품종이 많아도 접어서 스캔 쉬움. <b>권장.</b></Note>
          <div className="rounded-lg overflow-hidden border border-slate-200">
            <VarietyAccordion />
          </div>
        </DCArtboard>

        <DCArtboard id="b" label="B · 한 테이블 + 품종 구분행" width={560} height={560}>
          <Note>기존 평면 테이블 구조를 최대한 유지하고 품종 구분행만 삽입. 변경 최소 · 컬럼 정렬 일관. 다만 접기 불가, 품종 많아지면 길어짐.</Note>
          <div className="rounded-lg overflow-hidden border border-slate-200">
            <GroupedTable />
          </div>
        </DCArtboard>

        <DCArtboard id="c" label="C · 품종 카드 + 도정 소그룹" width={620} height={600}>
          <Note>품종을 카드 그리드로, 안에서 도정별로 한 번 더 묶음. 시각적 구분 가장 강하고 조밀. SKU가 품종당 적을 때 적합. 행이 많으면 카드가 길어져 비교는 불리.</Note>
          <div className="rounded-lg overflow-hidden border border-slate-200">
            <VarietyCards />
          </div>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

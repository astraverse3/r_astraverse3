<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>톤백 카드 D안 — 상태 표시 간소화 (뱃지 제거 / 점 아이콘)</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: { primary: { DEFAULT: '#2563eb', foreground: '#f8fafc' } } } },
  };
</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  html, body { font-family: 'Pretendard Variable', -apple-system, system-ui, sans-serif; margin: 0; }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
</style>
</head>
<body class="bg-slate-100">
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#2563eb"/>
    <rect x="30" y="30" width="40" height="40" rx="6" fill="#fff"/>
    <text x="50" y="58" font-size="22" font-weight="900" text-anchor="middle" fill="#2563eb" font-family="monospace">12</text>
  </svg>
</template>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">
const { useState } = React;

// 이 목록의 실제 상태는 보관중(AVAILABLE) / 소진됨(CONSUMED) 둘 뿐 — 필터 옵션 기준 확인
const ROWS = [
  { bagNo: 12,  farmer: '김재훈',                 actual: null,        lot: '250812-215-21-001', kg: 820,  status: 'AVAILABLE' },
  { bagNo: 7,   farmer: '이영수',                 actual: '대성농장',   lot: '250812-215-21-002', kg: 1040, status: 'AVAILABLE' },
  { bagNo: 103, farmer: '윤영식유기농영농조합법인', actual: null,        lot: '250811-215-21-003', kg: 760,  status: 'CONSUMED' },
  { bagNo: 4,   farmer: '박정호',                 actual: '한울정미소', lot: '250810-215-21-004', kg: 980,  status: 'AVAILABLE' },
  { bagNo: 28,  farmer: '최문성',                 actual: null,        lot: '관행',               kg: 720,  status: 'CONSUMED' },
];
const fullName = (r) => r.farmer + (r.actual ? ` (${r.actual})` : '');

function Check() { return <div className="w-4 h-4 rounded-sm border-2 border-slate-300 shrink-0" />; }
function BagNo({ r }) {
  return (
    <span className="w-[34px] shrink-0 text-right mono font-black text-[14px] text-slate-900 tabular-nums leading-none">
      <span className="text-[10px] font-bold text-slate-400">#</span>{r.bagNo}
    </span>
  );
}
function FarmerLot({ r }) {
  return (
    <div className="flex-1 min-w-0">
      <div className="font-bold text-[12.5px] text-slate-800 leading-tight truncate">{fullName(r)}</div>
      <div className="mono text-[10px] text-slate-400 leading-tight truncate mt-0.5">{r.lot}</div>
    </div>
  );
}
function Weight({ r }) {
  return (
    <span className="w-[52px] shrink-0 text-right mono font-bold text-[13px] text-slate-700 tabular-nums leading-none">
      {r.kg.toLocaleString()}<span className="text-[9px] font-bold text-slate-400 ml-px">kg</span>
    </span>
  );
}
function Dot({ status }) {
  const c = status === 'AVAILABLE' ? 'bg-primary' : status === 'CONSUMED' ? 'bg-slate-300' : 'bg-amber-400';
  return <span className={`shrink-0 w-2 h-2 rounded-full ${c}`} title={status} />;
}
function MoreDots() {
  return (
    <span className="shrink-0 -mr-1 w-6 h-6 flex items-center justify-center text-slate-400">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
    </span>
  );
}

// mode: 'none' (뱃지 제거) | 'dot' (점 아이콘)
function Detail({ r, mode }) {
  const consumed = r.status === 'CONSUMED';
  return (
    <div className={`relative flex items-center gap-2 rounded-lg border shadow-sm px-2.5 py-2 ${consumed ? 'border-slate-200 bg-slate-50' : 'border-slate-200/80 bg-white'}`}>
      <div className={`flex items-center gap-2 w-full ${consumed ? 'opacity-55' : ''}`}>
        <Check />
        <BagNo r={r} />
        <FarmerLot r={r} />
        <Weight r={r} />
        {mode === 'dot' && <Dot status={r.status} />}
        <MoreDots />
      </div>
    </div>
  );
}

function Chevron({ up }) {
  return <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#94a3b8" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d={up ? 'm18 15-6-6-6 6' : 'm6 9 6 6 6-6'}/></svg>;
}
function GroupHeader() {
  return (
    <div className="flex flex-col p-3 rounded-xl border border-slate-200 bg-white shadow-md">
      <div className="flex items-center justify-between mb-1.5 gap-2">
        <div className="flex items-center gap-2">
          <div className="w-5 h-5 rounded-md border-2 border-slate-300 shrink-0" />
          <div className="flex items-center gap-1.5 flex-wrap">
            <span className="font-bold text-[15px] text-[#2a2a2a] leading-none">검정보리찰벼</span>
            <span className="text-[11px] text-slate-500 font-medium bg-white border border-slate-200 px-1 py-0.5 rounded shadow-sm leading-none">2025년</span>
            <span className="text-[10px] px-1.5 h-4 inline-flex items-center border border-emerald-200 text-emerald-600 bg-emerald-50 rounded-sm">유기농</span>
          </div>
        </div>
        <Chevron up />
      </div>
      <div className="flex items-end justify-between mt-1 pl-7">
        <div className="text-[12px] text-slate-600 font-medium">생산자 <b className="text-slate-800">4명</b></div>
        <div className="flex items-baseline gap-2.5">
          <div className="text-[11px] text-slate-500">톤백 <b className="text-slate-700">5개</b></div>
          <div className="text-[17px] font-black text-slate-900 tracking-tight leading-none mono">4,320<span className="text-[11px] font-bold ml-0.5 opacity-70">kg</span></div>
        </div>
      </div>
    </div>
  );
}

function Screen({ mode }) {
  return (
    <div className="absolute inset-0 flex flex-col bg-slate-50 overflow-hidden">
      <div className="h-7 shrink-0 flex items-end justify-between px-5 pb-0.5 text-[11px] font-semibold text-slate-700">
        <span>9:41</span><span className="mono">5G ▮▮▮</span>
      </div>
      <header className="h-11 shrink-0 px-4 flex items-center justify-between bg-white border-b border-slate-200">
        <div className="flex items-center gap-1.5">
          <div className="w-5 h-5 rounded-md bg-primary text-white font-black text-[10px] flex items-center justify-center">M</div>
          <span className="text-[12px] font-black tracking-tight text-slate-800">milling.log</span>
        </div>
        <div className="w-7 h-7 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-[10px]">K</div>
      </header>
      <div className="shrink-0 bg-white border-b border-slate-200 px-4 flex items-center gap-1">
        <div className="relative px-3.5 py-2 text-[14px] font-bold text-slate-900">벼<div className="absolute left-2 right-2 -bottom-px h-[2.5px] bg-primary rounded-full" /></div>
        <div className="px-3.5 py-2 text-[13px] font-semibold text-slate-400">잡곡</div>
      </div>
      <div className="shrink-0 bg-white px-3 py-2 border-b border-slate-100">
        <div className="h-9 rounded-lg bg-slate-100 flex items-center px-3 gap-2">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" strokeWidth="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <span className="text-[12px] text-slate-500">검정보리</span>
        </div>
      </div>
      <div className="flex-1 overflow-hidden pt-2">
        <div className="flex flex-col gap-2">
          <GroupHeader />
          <div className="flex flex-col gap-1.5 p-2 mx-1 rounded-lg bg-slate-50/70 border border-slate-100">
            {ROWS.map((r) => <Detail key={r.bagNo} r={r} mode={mode} />)}
          </div>
        </div>
      </div>
    </div>
  );
}

function Phone({ w = 390, h = 640, mode }) {
  return (
    <div className="relative mx-auto" style={{ width: w + 18, height: h + 18 }}>
      <div className="absolute inset-0 rounded-[38px] bg-slate-900 shadow-xl" />
      <div className="absolute rounded-[30px] overflow-hidden" style={{ top: 9, left: 9, right: 9, bottom: 9 }}>
        <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[100px] h-[18px] bg-slate-900 rounded-b-[12px] z-50" />
        <Screen mode={mode} />
      </div>
    </div>
  );
}

function Note({ children, tone }) {
  const c = tone === 'good' ? 'text-emerald-700' : 'text-slate-500';
  return <div className={`text-[11px] leading-relaxed mb-2 px-1 ${c}`}>{children}</div>;
}

function App() {
  return (
    <DesignCanvas>
      <DCSection id="s" title="톤백 카드 — 상태 표시 간소화 (실제 사이즈)" subtitle="이 목록 상태는 보관중/소진됨 2종. 소진 행은 회색 배경+흐림으로 이미 구분됨. iPhone 14(390px) 기준.">
        <DCArtboard id="A" label="A · 뱃지 완전 제거 (행 배경/흐림으로 구분)" width={408} height={700}>
          <div className="p-3">
            <Note tone="good">상태칩 없음 → 생산자/LOT 가변폭이 ~50px 더 늘어 가장 여유로움. 소진 행은 회색 배경 + 흐림 처리로 한눈에 구분(#103·#28).</Note>
            <Phone mode="none" />
          </div>
        </DCArtboard>

        <DCArtboard id="B" label="B · 점 아이콘 (보관=파랑 · 소진=회색)" width={408} height={700}>
          <div className="p-3">
            <Note>상태를 8px 점으로만 표시 → 뱃지 대비 ~34px 절약. 텍스트 없이 색으로만 구분, 소진 행 흐림과 함께 보조 단서.</Note>
            <Phone mode="dot" />
          </div>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

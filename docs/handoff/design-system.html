<script type="text/babel">
const { useState } = React;

// ---------- 공통 래퍼 ----------
function Section({ id, title, subtitle, children }) {
  return (
    <section id={id} className="scroll-mt-16 mb-16">
      <div className="mb-6">
        <h2 className="text-[22px] font-bold tracking-tight text-slate-900">{title}</h2>
        {subtitle && <p className="text-[13.5px] text-slate-500 mt-1">{subtitle}</p>}
      </div>
      <div className="space-y-6">{children}</div>
    </section>
  );
}

function Card({ title, children, code, note }) {
  return (
    <div className="bg-white border border-slate-200 rounded-xl overflow-hidden">
      {title && (
        <div className="px-5 py-3 border-b border-slate-100 flex items-baseline justify-between">
          <h3 className="text-[14px] font-bold text-slate-800">{title}</h3>
          {note && <span className="text-[11px] text-slate-400">{note}</span>}
        </div>
      )}
      <div className="p-6">{children}</div>
      {code && (
        <pre className="code bg-slate-900 text-slate-100 px-5 py-3 overflow-auto whitespace-pre-wrap border-t border-slate-900">{code}</pre>
      )}
    </div>
  );
}

function Swatch({ name, value, className, note }) {
  return (
    <div className="flex items-center gap-3">
      <div className={`w-12 h-12 rounded-lg border border-slate-200 shrink-0 ${className || ''}`} style={className ? undefined : { background: value }} />
      <div className="min-w-0">
        <div className="text-[12.5px] font-semibold text-slate-800">{name}</div>
        <div className="text-[11px] text-slate-500 font-mono">{value}</div>
        {note && <div className="text-[11px] text-slate-400 mt-0.5">{note}</div>}
      </div>
    </div>
  );
}

function TypeRow({ label, cls, weight, use, sample }) {
  return (
    <div className="flex items-baseline gap-6 py-3 border-b border-slate-100 last:border-b-0">
      <div className="w-40 shrink-0">
        <div className="text-[12.5px] font-semibold text-slate-800">{label}</div>
        <div className="text-[11px] text-slate-400 font-mono">{cls} · {weight}</div>
      </div>
      <div className={`flex-1 text-slate-900 ${cls}`} style={{ fontWeight: weight }}>
        {sample || '품종별 재고를 한눈에 확인'}
      </div>
      <div className="w-44 shrink-0 text-[11px] text-slate-500">{use}</div>
    </div>
  );
}

// ---------- TOC ----------

  { id: 'foundations', label: 'Foundations' },
  { id: 'dataviz',     label: 'Data Viz · 품종' },
  { id: 'yield',       label: 'Yield Color' },
  { id: 'charts',      label: 'Chart Spec' },
  { id: 'numbers',     label: 'Number Rules' },
  { id: 'status',      label: '상태 라이브러리' },
  { id: 'milltypes',   label: '도정 타입' },
  { id: 'click',       label: 'Click Affordance' },
  { id: 'empty',       label: 'Empty / Loading' },
  { id: 'notice',      label: '공지 / 안내' },
  { id: 'icons',       label: 'Iconography' },
  { id: 'sidebar',     label: 'PC Sidebar' },
  { id: 'mobilenav',   label: 'Mobile Nav' },
  { id: 'header',      label: 'Header' },
  { id: 'tabs',        label: 'Tabs (F)' },
  { id: 'cards',       label: 'Variety Card' },
  { id: 'table',       label: 'Group Table' },
  { id: 'buttons',     label: 'Actions' },
  { id: 'chips',       label: 'Chips' },
  { id: 'patterns',    label: 'List Pattern' },

          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <Swatch name="Primary (UI)" value="#2563eb · blue-600" className="bg-[#2563eb]" note="UI 액션, active, 링크" />
            <Swatch name="Primary Tint" value="#eff6ff · blue-50" className="bg-[#eff6ff]" note="active bg, 검색 hover" />
            <Swatch name="Foreground" value="#0f172a · slate-900" className="bg-[#0f172a]" note="본문 텍스트" />
            <Swatch name="Muted Foreground" value="#64748b · slate-500" className="bg-[#64748b]" note="보조 텍스트" />
            <Swatch name="Border" value="#e2e8f0 · slate-200" className="bg-[#e2e8f0]" />
            <Swatch name="Muted" value="#f1f5f9 · slate-100" className="bg-[#f1f5f9]" note="아이콘 버튼 배경" />
            <Swatch name="Background" value="#ffffff" className="bg-white" />
            <Swatch name="Surface Muted" value="#f8fafc · slate-50" className="bg-[#f8fafc]" note="테이블 그룹 헤더" />
          </div>
          <div className="mt-5 pt-5 border-t border-slate-100 grid grid-cols-2 md:grid-cols-4 gap-4">
            <Swatch name="Success" value="emerald-600 / 50" className="bg-emerald-600" note="마감됨, 도달, 성공" />
            <Swatch name="Warning" value="amber-600 / 50" className="bg-amber-600" note="포장중, 부진(수율)" />
            <Swatch name="Info" value="sky-600 / 50" className="bg-sky-600" note="도정중, 정보 안내" />

        <div className="grid md:grid-cols-3 gap-4">

            <ul className="space-y-2.5 text-[12.5px]">
              {[

                ['rounded-md', '6px', '버튼·작은 카드'],
                ['rounded-lg', '8px', '카드 default'],
                ['rounded-xl', '12px', '큰 카드·모달'],

                  <span className="text-[11px] text-slate-400 font-mono">{v}</span>
                </li>
              ))}
            </ul>
          </Card>
          <Card title="Shadow">
            <div className="space-y-4">
              <div className="bg-white p-3 rounded-lg shadow-sm border border-slate-100"><code className="text-[11.5px]">shadow-sm</code> — 테이블·카드</div>
              <div className="bg-white p-3 rounded-lg shadow border border-slate-100"><code className="text-[11.5px]">shadow</code> — 팝오버</div>
              <div className="bg-white p-3 rounded-lg shadow-lg border border-slate-100"><code className="text-[11.5px]">shadow-lg</code> — 모달</div>
              <div className="bg-white p-3 rounded-full" style={{boxShadow:'0 4px 24px rgba(0,0,0,0.10)', border:'1px solid #e2e8f0'}}>
                <span className="text-[11.5px]">모바일 네비 커스텀</span>
              </div>
            </div>
          </Card>
          <Card title="Motion">
            <ul className="space-y-2 text-[12.5px] text-slate-700">

              <li><code className="font-mono text-[11px]">400ms+60ms</code> — 네비 blob 잔상</li>

              <code className="font-mono">motion-safe:</code> / <code className="font-mono">motion-reduce:</code> variant 적극 사용

        <Card title="Variety Palette" note="로고 픽셀 분포 기반">
          <window.VarietyPaletteShowcase />
          <div className="mt-5 pt-5 border-t border-slate-100 grid md:grid-cols-2 gap-4 text-[11.5px]">
            <div className="bg-slate-50 border border-slate-100 rounded-lg p-3 leading-relaxed">
              <div className="font-bold text-slate-700 mb-1">추출 메모</div>

                <li>메벼은 로고 진청(<code className="font-mono">#0060b0</code>) 대비 한 단계 밝게 조정 — 어두운 차트에서는 채도가 높은 편이 가독성 좋음</li>

                <li>텍스트 위 배경에는 <code className="font-mono">bg</code>(옷), 다크 텍스트는 <code className="font-mono">text</code></li>
                <li>품종이 추가되면 이 파일의 <code className="font-mono">VARIETY_TOKENS</code> 에만 등록</li>
              </ul>

          </div>

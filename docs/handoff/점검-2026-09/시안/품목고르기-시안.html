<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>품목 고르기 시안 — 주문 추가 · 품목 추가</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>html,body{font-family:'Pretendard Variable',-apple-system,system-ui,sans-serif;margin:0}.font-mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}a{color:#2563eb}a:hover{color:#1d4ed8}</style>
</head>
<body class="bg-slate-100">
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="sku-picker-parts.jsx"></script>
<script type="text/babel">
function App() {
  return <DesignCanvas>
    <DCSection id="dlg" title="① 주문 추가 창" subtitle="검색칸에 들어가거나 글자를 치면 결과가 펼쳐짐(최대 5줄) · 고르면 결과를 닫고 「✓ 품목 · 포장지 [바꾸기]」 한 줄 + 수량 · 수령인은 안내 문구로">
      <DCArtboard id="dlg-search" label="찾는 중" width={500} height={560}><PkDialog step="search" /></DCArtboard>
      <DCArtboard id="dlg-picked" label="고른 뒤" width={500} height={560}><PkDialog step="picked" /></DCArtboard>
    </DCSection>
    <DCSection id="panel" title="② 건 상세 · 고치는 중 — 품목 추가" subtitle="목록 맨 아래 한 줄로 접힘 · 펼치면 같은 고르기 부품 · 닫기는 ✕ 하나 · 「추가」는 수량 옆 · 이미 있는 품목은 「이미 있음」">
      <DCArtboard id="p-closed" label="접힘" width={470} height={720}><PkPanel step="closed" /></DCArtboard>
      <DCArtboard id="p-search" label="찾는 중 (기장 1kg는 이미 있음)" width={470} height={720}><PkPanel step="search" /></DCArtboard>
      <DCArtboard id="p-picked" label="고른 뒤" width={470} height={720}><PkPanel step="picked" /></DCArtboard>
    </DCSection>
  </DesignCanvas>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

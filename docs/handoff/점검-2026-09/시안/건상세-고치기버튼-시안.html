<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>건 상세 고치기 시안</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>html,body{font-family:'Pretendard Variable',-apple-system,system-ui,sans-serif;margin:0}.font-mono{font-family:ui-monospace,'SF Mono',Menlo,monospace}a{color:#2563eb}a:hover{color:#1d4ed8}</style>
</head>
<body class="bg-slate-100">
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">
const EdIco = {
  pencil: <><path d="M21.17 6.81a2.8 2.8 0 0 0-3.98-3.98L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"/><path d="m15 5 4 4"/></>,
  x: <path d="M18 6 6 18M6 6l12 12"/>,
  check: <path d="M20 6 9 17l-5-5"/>,
  trash: <><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></>,
  minus: <path d="M5 12h14"/>,
  plus: <path d="M12 5v14M5 12h14"/>,
  lock: <><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></>,
};
function EdI({ n, s = 16 }) {
  return <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{EdIco[n]}</svg>;
}
const edClose = <button className="w-8 h-8 rounded-md flex items-center justify-center text-slate-500 hover:bg-slate-100"><EdI n="x" s={18} /></button>;
const edEditBtn = <button className="h-8 px-3 rounded-md border border-slate-300 bg-white text-slate-700 text-[13px] font-semibold inline-flex items-center gap-1.5 hover:bg-slate-50"><span className="text-blue-600 flex"><EdI n="pencil" s={14} /></span>고치기</button>;
const edChip = <span className="h-6 px-2 rounded-md bg-blue-50 text-blue-700 text-[12px] font-semibold inline-flex items-center gap-1"><EdI n="pencil" s={12} />고치는 중</span>;

function EdMeta() {
  return <>
    <div className="flex items-center gap-3 pt-1">
      <div className="h-2 flex-1 rounded-full bg-slate-100"></div>
      <span className="text-[12px] font-mono text-slate-500">0/31</span>
    </div>
    <div className="flex items-center gap-1.5 text-[12px]">
      <span className="text-slate-500"><b className="text-slate-700">8</b>품목</span>
      <span className="rounded px-1.5 py-0.5 font-semibold bg-slate-100 text-slate-600">대기 8</span>
    </div>
  </>;
}
const EdEyebrow = () => <span className="text-[11px] font-bold uppercase tracking-wider text-slate-500">수령인 주문 상세<span className="ml-1.5 font-semibold font-mono">1/2</span></span>;
const EdTitle = () => <h2 className="flex items-baseline gap-2 text-[19px] font-bold leading-none text-slate-900">급식센터<span className="border-l border-slate-300 pl-2 text-[14px] font-medium text-slate-500">해남급식</span></h2>;

const ED_LINES = [
  { t: '천지향1세 10kg', p: '천지향', q: 8, v: 6 },
  { t: '백옥찰 · 찹쌀 10kg', p: '땅끝에서보냅니다', q: 1 },
  { t: '귀리 1kg', p: '땅끝에서보냅니다', q: 5, lock: 2 },
  { t: '찰보리 1kg', p: '땅끝에서보냅니다', q: 2 },
  { t: '기장 1kg', p: '땅끝에서보냅니다', q: 7 },
  { t: '흑미 1kg', p: '땅끝에서보냅니다', q: 1 },
  { t: '차조 1kg', p: '땅끝에서보냅니다', q: 2 },
  { t: '수수 1kg', p: '땅끝에서보냅니다', q: 5 },
];

/* ── 지금 ── */
function EdNowDetail() {
  return <div className="h-full bg-white flex flex-col">
    <div className="relative border-b border-slate-200 px-5 pt-4 pb-3.5 flex flex-col gap-2">
      <div className="absolute right-3 top-3">{edClose}</div>
      <div className="flex items-center gap-2 pr-8"><EdEyebrow /><button className="ml-auto h-8 px-2 inline-flex items-center gap-1 text-[12px] font-medium text-blue-600"><EdI n="pencil" s={14} />고치기</button></div>
      <EdTitle /><EdMeta />
    </div>
    <div className="bg-slate-50 px-4 py-4 flex flex-col gap-2 flex-1">
      {ED_LINES.slice(0, 4).map(l => <div key={l.t} className="bg-white border border-slate-200 rounded-xl px-4 py-3"><p className="text-[13px] font-bold text-slate-800">{l.t}</p><p className="text-[12px] text-slate-500">차감 0 · 남은 {l.q}</p></div>)}
    </div>
  </div>;
}
function EdNowEdit() {
  return <div className="h-full bg-white flex flex-col">
    <div className="relative border-b border-slate-200 px-5 pt-4 pb-3.5 flex flex-col gap-2">
      <div className="absolute right-3 top-3">{edClose}</div>
      <div className="flex items-center gap-2 pr-8"><EdEyebrow /><span className="ml-auto rounded bg-blue-50 px-1.5 py-0.5 text-[11px] font-semibold text-blue-600">고치는 중</span></div>
      <EdTitle /><EdMeta />
    </div>
    <div className="bg-slate-50 px-4 py-4 flex flex-col gap-2 flex-1 overflow-hidden">
      <p className="px-1 text-[12px] text-slate-500">수량을 고치고 <b className="text-slate-700">저장</b>을 누르세요. 0이면 품목이 취소돼요. 차감된 수보다 적게는 못 줄여요.</p>
      {ED_LINES.map(l => <div key={l.t} className="bg-white border border-slate-200 rounded-xl px-3.5 py-2.5">
        <p className="text-[13px] font-bold text-slate-800">{l.t} <span className="text-[11px] font-normal text-slate-400">{l.p}</span></p>
        <div className="mt-2 flex items-center gap-2"><span className="text-[12px] text-slate-500">주문</span><span className="h-8 w-24 border border-slate-300 rounded-md text-right px-2 leading-8 text-[13px]">{l.q}</span><span className="text-[12px] text-slate-500">개</span>
          <span className="ml-auto h-8 px-3 rounded-md bg-blue-300 text-white text-[13px] inline-flex items-center gap-1"><EdI n="check" s={14} />저장</span>
          <span className="h-8 px-3 rounded-md border border-red-200 text-red-600 text-[13px] inline-flex items-center gap-1"><EdI n="trash" s={14} />취소</span></div>
      </div>)}
    </div>
    <div className="border-t border-slate-200 px-4 py-3 flex items-center"><span className="h-11 px-3 rounded-md border border-red-200 text-red-600 text-[13px] inline-flex items-center gap-1.5"><EdI n="trash" s={15} />이 건 취소</span><span className="ml-auto h-11 px-5 rounded-md bg-blue-600 text-white text-[14px] font-semibold inline-flex items-center">완료</span></div>
  </div>;
}

/* ── 새 고치기 목록 ── */
function EdStepper({ v, changed }) {
  const b = 'w-8 h-8 flex items-center justify-center text-slate-500 hover:bg-slate-50';
  return <div className={`h-8 inline-flex items-center rounded-md border bg-white overflow-hidden ${changed ? 'border-blue-500 ring-2 ring-blue-100' : 'border-slate-300'}`}>
    <button className={b}><EdI n="minus" s={14} /></button>
    <span className={`w-11 text-center font-mono text-[14px] font-semibold border-x ${changed ? 'border-blue-200 text-blue-700' : 'border-slate-200 text-slate-800'}`} style={{ lineHeight: '30px' }}>{v}</span>
    <button className={b}><EdI n="plus" s={14} /></button>
  </div>;
}
function EdRow({ l }) {
  const changed = l.v !== undefined && l.v !== l.q;
  return <div className={`flex items-center gap-3 pl-4 pr-2 h-14 ${changed ? 'bg-blue-50/60' : ''}`}>
    <div className="flex-1 min-w-0">
      <p className="text-[13px] font-semibold text-slate-800 truncate">{l.t}</p>
      <p className="text-[12px] text-slate-500 truncate">
        {l.lock ? <span className="text-emerald-700 font-medium inline-flex items-center gap-1"><EdI n="lock" s={11} />{l.lock}개 차감됨 · 최소 {l.lock}</span>
          : changed ? <span className="text-blue-700 font-medium"><span className="font-mono">{l.q}</span> → <span className="font-mono">{l.v}</span>개</span>
          : l.p}
      </p>
    </div>
    <EdStepper v={changed ? l.v : l.q} changed={changed} />
    <div className="w-[60px] flex justify-end">
      {changed
        ? <button className="h-8 px-3 rounded-md bg-blue-600 text-white text-[13px] font-semibold">저장</button>
        : <button disabled={!!l.lock} title={l.lock ? '차감을 먼저 취소하세요' : '품목 취소'} className={`w-8 h-8 rounded-md flex items-center justify-center ${l.lock ? 'text-slate-300' : 'text-slate-500 hover:bg-red-50 hover:text-red-600'}`}><EdI n="trash" s={16} /></button>}
    </div>
  </div>;
}
function EdEditBody() {
  return <div className="flex-1 min-h-0 bg-slate-50 px-4 py-3 flex flex-col gap-2 overflow-hidden">
    <p className="px-1 text-[12px] text-slate-500">바꾼 줄만 <b className="text-slate-700">저장</b>이 떠요 · 0이면 품목 취소</p>
    <div className="bg-white border border-slate-200 rounded-xl divide-y divide-slate-100 overflow-hidden">
      {ED_LINES.map(l => <EdRow key={l.t} l={l} />)}
    </div>
  </div>;
}
function EdEditFooter() {
  return <div className="shrink-0 border-t border-slate-200 px-4 py-3 flex items-center gap-2">
    <button className="h-11 px-3 rounded-md text-red-600 text-[13px] font-semibold inline-flex items-center gap-1.5 hover:bg-red-50"><EdI n="trash" s={15} />이 건 모두 취소</button>
    <button className="ml-auto h-11 px-6 rounded-md bg-blue-600 text-white text-[14px] font-semibold">완료</button>
  </div>;
}

/* A: [고치기][X] 한 묶음 */
function EdA({ editing }) {
  return <div className="h-full bg-white flex flex-col">
    <div className="shrink-0 border-b border-slate-200 pl-5 pr-3 pt-3 pb-3.5 flex flex-col gap-2">
      <div className="flex items-center gap-2 min-h-8"><EdEyebrow /><div className="ml-auto flex items-center gap-1">{editing ? edChip : edEditBtn}{edClose}</div></div>
      <EdTitle />{!editing && <EdMeta />}
    </div>
    {editing ? <><EdEditBody /><EdEditFooter /></> : <div className="flex-1 bg-slate-50"></div>}
  </div>;
}
/* B: 제목 줄 오른쪽 */
function EdB({ editing }) {
  return <div className="h-full bg-white flex flex-col">
    <div className="relative shrink-0 border-b border-slate-200 px-5 pt-4 pb-3.5 flex flex-col gap-2">
      <div className="absolute right-3 top-3">{edClose}</div>
      <div className="pr-8 h-5 flex items-center"><EdEyebrow /></div>
      <div className="flex items-center gap-3 min-h-8"><div className="flex-1 min-w-0"><EdTitle /></div>{editing ? edChip : edEditBtn}</div>
      {!editing && <EdMeta />}
    </div>
    {editing ? <><EdEditBody /><EdEditFooter /></> : <div className="flex-1 bg-slate-50"></div>}
  </div>;
}

function App() {
  const W = 470, H = 300, HE = 760;
  return <DesignCanvas>
    <DCSection id="now" title="지금" subtitle="고치기가 글자 링크처럼 떠 있음 · 고치는 중엔 줄마다 저장+빨강 취소가 반복돼 시끄럽고 8품목이 한 화면에 안 들어옴">
      <DCArtboard id="now1" label="평소" width={W} height={HE}><EdNowDetail /></DCArtboard>
      <DCArtboard id="now2" label="고치는 중" width={W} height={HE}><EdNowEdit /></DCArtboard>
    </DCSection>
    <DCSection id="a" title="A안 — 오른쪽 위 [고치기][X] 한 묶음" subtitle="테두리 버튼 h-8 · 고치는 중엔 같은 자리에 「고치는 중」 표시 · 진행 막대는 숨김">
      <DCArtboard id="a1" label="평소" width={W} height={H}><EdA /></DCArtboard>
      <DCArtboard id="a2" label="고치는 중 — 한 목록 · 줄 56 · 바꾼 줄만 저장" width={W} height={HE}><EdA editing /></DCArtboard>
    </DCSection>
    <DCSection id="b" title="B안 — 제목 줄 오른쪽" subtitle="X는 혼자 모서리 · 버튼이 제목과 같은 줄">
      <DCArtboard id="b1" label="평소" width={W} height={H}><EdB /></DCArtboard>
      <DCArtboard id="b2" label="고치는 중" width={W} height={HE}><EdB editing /></DCArtboard>
    </DCSection>
  </DesignCanvas>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
